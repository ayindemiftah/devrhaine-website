<!DOCTYPE html>
<html>
  <head><title>DOM project</title></head>
  <body>
    <p>YouTube Subscribe Button</p>
    <button onclick="
     subscribe();
    " class="js-subscribe-button">subscribe</button>

    <p>Amazon shipping calculator</p>
    <input class="js-cost-input" onkeydown="
     handleCostKeydown(event);
    ">
    
    <button onclick="
     calculateTotal (event);
    ">calculate</button>

    <p class="resultDisplay"></p>
   <script>
    String(25);
    console.log( '25' -5);
    console.log( '25' +5);

    window.document
    window.console.log('window');
    window.alert

    function handleCostKeydown(){
   
      if (event.key === 'Enter'){
      calculateTotal ();
    }
    }

    function calculateTotal (){
    const buttonElement=document.querySelector('.js-cost-input');
     let cost = Number (buttonElement.value );
 

     if (cost < 40){
      cost = cost + 10;
    } 
     
     document.querySelector('.resultDisplay')
      .innerHTML=`$${cost.toFixed(2)}`;
    }

    function subscribe (){
      const buttonElement =document.querySelector ('.js-subscribe-button');

      if(buttonElement.innerText === 'subscribe'){
        buttonElement.innerHTML =  'subscribed';
      }else{
        buttonElement.innerHTML = 'subscribe';
      }
    }
   </script>
  </body>
</html>
