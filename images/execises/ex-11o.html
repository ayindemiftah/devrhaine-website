  <!DOCTYPE html>
<html>
  <head></head>
  <body>
    <script>
     
  function removeEgg(foods){
     let result = [];
     let eggCount = 0;
     let above = foods.slice().reverse();
    for(let i= 0; i<above.length; i++){
      if (above[i] === 'egg' && eggCount < 2){
      eggCount ++;
     continue;

      } result.push(above[i])
    }return result.reverse();
  }
  console.log (removeEgg(['egg', 'apple', 'egg', 'egg', 'ham']))

    </script>
  </body>
</html>
