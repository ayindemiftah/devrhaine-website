

<!DOCTYPE html>
  <html>
    <head>
    <title>rock paper scissors</title>
     <link rel="stylesheet" href="styles/10-rock-paper-scissors.css">
  </head>
  <body>
  
    <p class="title"> Rock Paper Scissors</p>
    
    <button onclick="
      playGame('rock');
      " class="move-button">
     <img class="move-icon" src="images/rock-emoji.png">
    </button>

    <button onclick="
      playGame('paper');
    " class="move-button">
     <img class="move-icon" src="images/paper-emoji.png">
    </button>

    <button onclick="
    playGame('scissors');
    " class="move-button">
     <img class="move-icon" src="images/scissors-emoji.png">
    </button>

    <p class="js-Result result">you win</p>

    <p class="js-move"></p>

    <p class="js-score score"></p>
    

    <button onclick="
    score.wins =0;
    score.lose = 0;
    score.ties = 0;

    localStorage.removeItem('score');
    updateScoreElement();
    " 
    class="rest-score-button"
    >
      Reset score
    </button> 
    <script src="scripts/10-rock-paper-scissor.js"></script>
  </body>
</html>
